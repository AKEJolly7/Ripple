# 观澜（Ripple）技术分析阈值 —— 全部可参数化
# 命令行可用同名 -D 覆盖，如 -Dsegment.retrace.pct=10

# 局部极值检测的滚动窗口（单侧天数）
local.extreme.window=5

# 均线周期（计算 MA5/20/60）
ma.5=5
ma.20=20
ma.60=60

# 金叉/死叉使用的一对均线
ma.cross.short=20
ma.cross.long=60

# RSI 周期
rsi.period=14

# 20 日滚动波动率窗口（日收益率标准差）
volatility.window=20

# 成交量均线窗口与异常放量倍数（> N 倍前 N 日均值）
volume.window=20
volume.spike.multiplier=3.0

# 显著单日涨跌阈值（%）
big.move.pct=5.0

# 趋势段划分：回撤终止阈值（%）、净涨跌幅判定阈值（%，|净涨跌|≥此值才算涨/跌段）
segment.retrace.pct=8.0
segment.min.trend.pct=5.0
